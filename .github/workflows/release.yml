# ── MoSim Mod Tracker — Tauri cross-platform release builder ─────────────────
# Triggers on any version tag: git tag v1.2.3 && git push --tags
#
# Produces platform-native installers and attaches them to a GitHub Release:
#   Windows  → NSIS .exe   (or WiX .msi)
#   macOS    → .dmg        (Intel + Apple Silicon, as separate jobs)
#   Linux    → .AppImage   (and/or .deb)
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Python: generate installer assets ──────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - run: python installer/generate-assets.py

      # ── Node.js ────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── Rust toolchain ─────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Linux: system libraries required by WebKitGTK ─────────────────────
      - name: Install WebKitGTK dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Install npm dependencies ───────────────────────────────────────────
      - name: Install root deps (Tauri CLI)
        run: npm ci

      - name: Install web deps
        run: npm --prefix web ci

      # ── Generate Tauri icon set from the brand icon ───────────────────────
      - name: Generate Tauri icons
        run: npm run tauri -- icon installer/assets/icon.png

      # ── Build & publish via the official Tauri GitHub Action ──────────────
      # App binaries go to a "<tag>-bin" PRERELEASE so the public releases
      # page only shows the custom installers. The installer app downloads
      # from this companion release; /releases/latest never returns it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}-bin
          releaseName: "App binaries ${{ github.ref_name }} (internal)"
          releaseBody: |
            Raw app binaries used by the MoSim Mod Tracker installer.
            **Do not download these directly** — get the installer from the
            [main release](https://github.com/dfn-slxxp/MoSim-Mod-Tracker/releases/latest).
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

  build-installer:
    name: Build installer (${{ matrix.upload_name }})
    needs: publish-tauri
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows x64 ────────────────────────────────────────────────
          # Asset name deliberately avoids "setup"/"install" keywords so the
          # Windows Program Compatibility Assistant doesn't flag it on exit.
          - platform: windows-latest
            rust_target: ''
            tauri_args: ''
            artifact_cmd: |
              gh release upload $TAG "installer-app/src-tauri/target/release/mosim-setup.exe#MoSim-Mod-Tracker.exe" --clobber
            upload_name: MoSim-Mod-Tracker.exe

          # ── macOS Apple Silicon ─────────────────────────────────────────
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_args: '--bundles dmg --target aarch64-apple-darwin'
            artifact_cmd: |
              DMG=$(find installer-app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
              gh release upload $TAG "${DMG}#MoSim-Mod-Tracker-arm.dmg" --clobber
            upload_name: MoSim-Mod-Tracker-arm.dmg

          # ── macOS Intel ─────────────────────────────────────────────────
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            tauri_args: '--bundles dmg --target x86_64-apple-darwin'
            artifact_cmd: |
              DMG=$(find installer-app/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
              gh release upload $TAG "${DMG}#MoSim-Mod-Tracker-intel.dmg" --clobber
            upload_name: MoSim-Mod-Tracker-intel.dmg

          # ── Linux x64 ──────────────────────────────────────────────────
          - platform: ubuntu-22.04
            rust_target: ''
            tauri_args: '--bundles appimage'
            artifact_cmd: |
              APP=$(find installer-app/src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
              gh release upload $TAG "${APP}#MoSim-Mod-Tracker.AppImage" --clobber
            upload_name: MoSim-Mod-Tracker.AppImage

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Python: generate installer assets (icons) ──────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - run: python installer/generate-assets.py

      # ── Node.js ────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── Rust toolchain ─────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer-app/src-tauri

      # ── Linux: WebKitGTK required by Tauri ─────────────────────────────
      - name: Install WebKitGTK (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Install installer-app dependencies ─────────────────────────────
      - name: Install installer-app deps
        run: npm --prefix installer-app ci

      # ── Generate icons for the installer binary ────────────────────────
      - name: Generate installer icons
        working-directory: installer-app
        run: npx tauri icon ../installer/assets/icon.png

      # ── Build the installer ─────────────────────────────────────────────
      - name: Build installer app
        working-directory: installer-app
        run: npx tauri build ${{ matrix.tauri_args }}

      # ── Create the main release (installers only) if it doesn't exist ───
      # All 4 matrix jobs race here; `|| true` makes the losers no-ops.
      - name: Ensure main release exists
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "MoSim Mod Tracker $TAG" \
            --notes "## MoSim Mod Tracker $TAG

          Download the installer for your platform — it fetches and installs the app automatically.

          | Platform | Installer |
          |----------|-----------|
          | Windows 10/11 | \`MoSim-Mod-Tracker.exe\` |
          | macOS Apple Silicon | \`MoSim-Mod-Tracker-arm.dmg\` |
          | macOS Intel | \`MoSim-Mod-Tracker-intel.dmg\` |
          | Linux x64 | \`MoSim-Mod-Tracker.AppImage\` |

          ### Linux runtime dependency
          \`\`\`
          apt install libwebkit2gtk-4.1-0
          \`\`\`" \
            || true

      # ── Upload to the GitHub release ────────────────────────────────────
      - name: Upload installer artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: ${{ matrix.artifact_cmd }}
